name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build
      - name: CDK synth
        run: npm run cdk -- synth Haccoli-dev -c env=dev --quiet
        env:
          # synth のみなので AWS 認証は不要。ダミー値で検証する
          CDK_DEFAULT_ACCOUNT: "123456789012"
          HACCOLI_FROM_EMAIL: ci@example.com
